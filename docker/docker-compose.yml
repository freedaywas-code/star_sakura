services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: star_sakura
      POSTGRES_USER: star_sakura
      POSTGRES_PASSWORD: change-this-in-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U star_sakura -d star_sakura"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env.example
    environment:
      DJANGO_SETTINGS_MODULE: configs.settings.prod
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: star_sakura
      POSTGRES_USER: star_sakura
      POSTGRES_PASSWORD: change-this-in-production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      GUNICORN_WORKERS: 3
      GUNICORN_THREADS: 4
    volumes:
      - ../backend/media:/app/backend/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
